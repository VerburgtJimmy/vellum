# Paraphrase

- q: 'generate flat files i can upload to any host'
  page: commands
  section: vellumexport
  note: 'vellum:export writes a full static site: HTML, assets, raw Markdown, search index, feed, 404.html'
  kind: paraphrase
- q: 'what command does my deploy pipeline need and when does it blow up'
  page: commands
  section: vellumbuild
  note: 'vellum:build compiles everything, belongs in the deploy, and fails on duplicate URLs or unknown directives'
  kind: paraphrase
- q: 'text between my link tiles turns into its own tile'
  page: components/cards
  section: only-cards-belong-inside
  note: 'prose written between cards becomes its own grid cell; put it above the block'
  kind: paraphrase
- q: 'when do i use info vs tip vs danger'
  page: components/callouts
  section: the-five-types
  note: 'which callout type to use when (note, tip, info, warning, danger)'
  kind: paraphrase
- q: 'my numbered guide shows the wrong numbering'
  page: components/steps
  section: rules-worth-knowing
  note: 'only ## opens a step, and numbers are generated so you must not type them'
  kind: paraphrase
- q: 'do hidden panels still show up in the outline on the right'
  page: components/tabs
  section: rules-worth-knowing
  note: 'headings inside a tab panel still go in the table of contents; every panel is in the page and indexed'
  kind: paraphrase
- q: 'can i use this commercially, what are the terms'
  page: credits
  section: licences
  note: 'Vellum is MIT and every dependency is MIT or BSD'
  kind: paraphrase
- q: 'can i nest one custom element inside another'
  page: extending
  section: slots
  note: 'the body of a paired component tag is Markdown and can nest other components'
  kind: paraphrase
- q: 'typo in a component name, what happens on prod'
  page: extending
  section: missing-components
  note: 'unknown or disallowed components throw locally and at build; in production the page fails and it is logged'
  kind: paraphrase
- q: 'which fields go at the top of a page between the dashes'
  page: getting-started/configuration
  section: frontmatter
  note: 'which frontmatter keys a page accepts (title, description, slug, order, full, access)'
  kind: paraphrase
- q: 'my colour scheme name stopped working after updating'
  page: getting-started/upgrade
  section: colour-presets
  note: 'nine old presets were removed in 0.5 and fall back to neutral'
  kind: paraphrase
- q: 'old urls with the release number in them'
  page: getting-started/upgrade
  section: version-urls
  note: 'since 0.5 the latest version has no version segment in its URL and the old one 301s'
  kind: paraphrase
- q: 'grab the source of the page as text'
  page: page-actions
  section: copy-markdown
  note: 'the Copy Markdown button puts the page source on the clipboard'
  kind: paraphrase
- q: 'hide the buttons under the title'
  page: page-actions
  section: changing-them
  note: 'override or remove the page action row by overriding its Blade view'
  kind: paraphrase
- q: 'do private pages end up in the offline search bundle'
  page: search
  section: export
  note: 'the static export always uses the in-browser index and drops gated pages'
  kind: paraphrase
- q: 'og tags and canonical links missing'
  page: seo
  section: per-page
  note: 'each page gets a title, meta description, canonical and social card tags; canonical needs app.url'
  kind: paraphrase
- q: 'which looks come out of the box'
  page: theming
  section: presets
  note: 'the three shipped colour presets (neutral, ocean, laravel)'
  kind: paraphrase
- q: 'why are the panels lighter than the page background'
  page: theming
  section: surfaces
  note: 'the three background layers and why they only get darker in light mode'
  kind: paraphrase
- q: 'yaml error at the top of my file'
  page: troubleshooting
  section: invalid-frontmatter-in-file-
  note: 'YAML frontmatter did not parse, usually an unquoted colon or bad indentation'
  kind: paraphrase
- q: 'build fails on a triple colon block'
  page: troubleshooting
  section: unknown-docs-directive-name-in-file
  note: 'a ::: block with a misspelled name'
  kind: paraphrase
- q: 'visitors get a blank error screen, where is the real message'
  page: troubleshooting
  section: where-errors-appear
  note: 'in production a reader sees a generic error page and the reason goes to the log'
  kind: paraphrase
- q: 'typing in the search box gives no results at all'
  page: troubleshooting
  section: search-returns-nothing
  note: 'search is empty: check it is enabled and rebuild the index'
  kind: paraphrase
- q: 'my metadata prints as normal text on the page instead of being applied'
  page: troubleshooting
  section: failures-that-are-quiet
  note: 'problems that raise no error, such as frontmatter showing as body text'
  kind: paraphrase
- q: 'benefits of not using a static generator'
  page: why
  section: what-living-in-the-app-adds
  note: 'what serving docs from the app gives you: gates, sessions, live config values'
  kind: paraphrase
- q: 'will my config still work on the next release'
  page: why
  section: what-05-commits-to
  note: 'the stability promise: config keys, frontmatter and syntax frozen until 1.0'
  kind: paraphrase
- q: 'number gutter gets copied together with the code'
  page: writing/code-blocks
  section: line-numbers
  note: 'showLineNumbers adds a gutter that is not copied with the code'
  kind: paraphrase
- q: 'how do i display the three-colon syntax itself without it rendering'
  page: writing/code-blocks
  section: showing-directive-syntax
  note: 'show ::: or a fence literally by wrapping it in a longer fence'
  kind: paraphrase
- q: 'can i link to a specific paragraph on a page'
  page: writing/markdown
  section: headings-and-anchors
  note: 'every heading gets an id and copy-link control; # is reserved for the page title'
  kind: paraphrase
- q: 'order some pages manually and let the rest fill in after'
  page: writing/navigation
  section: keep-the-rest
  note: '"..." in meta.json places every unlisted page at that spot'
  kind: paraphrase
- q: 'svg and webp not loading from my assets folder'
  page: writing/images
  section: formats-the-route-will-serve
  note: 'which file types the asset route serves (images, fonts, video, pdf, zip) and what it refuses'
