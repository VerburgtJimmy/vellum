# Third set: decides boosted ranking versus weighted RRF. Paraphrase only;
# literal R@5 is measured on the literal questions of docs/questions.yml and
# heldout.yml combined. RRF wins if paraphrase R@1 improves by 5 points or
# more with literal R@5 unchanged. Notes describe the target; the questions
# are written by someone else.

- q: 'landing page for a folder that links out to its children'
  page: components/cards
  section: a-section-index
  note: 'an overview page that ends with a grid of cards handing the reader on'
  kind: paraphrase
