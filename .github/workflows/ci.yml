name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']
        include:
          - laravel: '11.*'
            testbench: '^9.0'
            pest: '^3.8'
            pest_plugin: '^3.2'
          - laravel: '12.*'
            testbench: '^10.0'
            pest: '^3.8'
            pest_plugin: '^3.2'
          - laravel: '13.*'
            testbench: '^11.0'
            pest: '^5.0'
            pest_plugin: '^5.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: |
          composer config audit.block-insecure false
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }}" \
            --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Pest
        run: vendor/bin/pest --colors=always

      - name: Pint
        if: matrix.laravel == '12.*'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.laravel == '12.*'
        run: vendor/bin/phpstan analyse --memory-limit=512M

  docs:
    name: Docs build and search check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The model is 30 MB and never changes for a given name, so it is worth
      # a cache key of its own rather than a download on every run.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: storage/vellum/models
          key: vellum-model-potion-base-8M

      - name: Fetch the embedding model
        run: vendor/bin/testbench vellum:model
        env:
          VELLUM_MODEL_PATH: storage/vellum/models

      # The questions a model wrote are committed under docs/.vellum, so this
      # needs no API key. --check-search asks docs/questions.yml and --strict
      # fails on a link, an image or a question that points at nothing.
      - name: Build the docs and ask the golden questions
        run: vendor/bin/testbench vellum:build --check-search --strict
        env:
          VELLUM_PATH: docs
          VELLUM_CHANGELOG: CHANGELOG.md
          VELLUM_MODEL_PATH: storage/vellum/models
          VELLUM_SEARCH_MIN: '0.65'

  assets:
    name: Frontend assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dist must match committed assets
        run: git diff --exit-code -- resources/dist

      - name: Size gate
        run: npm run check:size
