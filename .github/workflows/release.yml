name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A tag without its own section in CHANGELOG.md fails here rather than
      # going out with generated notes, as v0.9.4 once did. Write the
      # section, commit it, and move the tag to that commit.
      - name: Take the release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! python3 .github/scripts/changelog-section.py "$TAG" > notes.md; then
            echo "::error::CHANGELOG.md has no section for $TAG. Add one, commit it, and tag that commit."
            echo "No CHANGELOG.md section for $TAG, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with a suffix, v1.0.0-beta.1, is a prerelease.
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
            *)   PRERELEASE="" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            echo "Updated $TAG from the changelog." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # shellcheck disable=SC2086
          gh release create "$TAG" --title "$TAG" --verify-tag --notes-file notes.md $PRERELEASE
          echo "Published $TAG from the changelog." >> "$GITHUB_STEP_SUMMARY"
