name: Bug
description: Something does not work as documented
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Report security vulnerabilities by email to hey@jimmyverburgt.com instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected to happen, what happened instead, and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP
      placeholder: "8.4.10"
    validations:
      required: true
  - type: input
    id: laravel
    attributes:
      label: Laravel
      placeholder: "12.20"
    validations:
      required: true
  - type: input
    id: vellum
    attributes:
      label: Vellum
      placeholder: "0.5.0"
    validations:
      required: true
